<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>知识图谱模板页</title>
    <style>
      :root { --bg:#0b1020; --panel:rgba(18,26,47,.92); --panel-2:rgba(14,20,35,.92); --line:rgba(148,163,184,.18); --text:#e8eefc; --muted:#94a3b8; --blue:#4ea1ff; --orange:#ffb454; --shadow:0 18px 42px rgba(0,0,0,.28); }
      * { box-sizing:border-box; } body { margin:0; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(circle at top,#1a2c55,var(--bg) 42%); color:var(--text);} a { color:inherit; text-decoration:none; }
      .page { max-width:1080px; margin:0 auto; padding:28px 20px 48px; } .hero,.panel,.stat,.empty,pre { border:1px solid var(--line); border-radius:22px; background:var(--panel); box-shadow:var(--shadow);} .hero { padding:28px; background:linear-gradient(135deg,rgba(78,161,255,.18),rgba(176,132,255,.08)); }
      .badge { display:inline-flex; padding:6px 10px; border-radius:999px; background:rgba(255,180,84,.12); color:#fff0d6; font-size:12px; } h1 { margin:14px 0 10px; font-size:34px; } .hero p,.panel p,li { color:#bfd0ee; line-height:1.8; }
      .hero-actions,.tabs,.stats { display:flex; flex-wrap:wrap; gap:12px; } .hero-actions { margin-top:18px; } .btn { display:inline-flex; align-items:center; justify-content:center; padding:12px 16px; border-radius:14px; border:1px solid var(--line); background:rgba(78,161,255,.16); color:var(--text);} .btn.secondary { background:rgba(255,255,255,.04); }
      .stats { margin-top:18px; } .stat { min-width:160px; padding:16px 18px; } .stat-label { color:var(--muted); font-size:12px; } .stat-value { margin-top:8px; font-size:24px; font-weight:700; }
      .section { margin-top:22px; } .tabs { margin-bottom:14px; } .tab-btn { border:1px solid var(--line); background:rgba(12,18,34,.9); color:var(--muted); padding:10px 14px; border-radius:999px; cursor:pointer; } .tab-btn.active { color:var(--text); background:rgba(78,161,255,.16); border-color:rgba(78,161,255,.4); }
      .panel { padding:20px; } .view { display:none; } .view.active { display:block; } .meta-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; } .meta-item { padding:14px; border:1px solid rgba(148,163,184,.14); border-radius:16px; background:var(--panel-2); } .meta-item strong { display:block; margin-bottom:8px; }
      .empty { padding:18px; color:var(--muted); } ul { margin:0; padding-left:18px; } pre { margin:0; padding:16px; overflow:auto; background:rgba(7,14,27,.95); line-height:1.7; } @media (max-width:760px) { .meta-grid { grid-template-columns:1fr; } h1 { font-size:28px; } }
    </style>
  </head>
  <body>
    <div class="page"><section class="hero"><span class="badge" id="statusBadge">模板页</span><h1 id="pageTitle">知识图谱模板页</h1><p id="pageDescription">正在加载图谱模板数据…</p><div class="hero-actions"><a class="btn" href="./graph.json">查看 graph.json</a><a class="btn secondary" href="../../index.html">返回总站首页</a></div><div class="stats" id="stats"></div></section><section class="section"><div class="tabs"><button class="tab-btn active" data-tab="overview">概览</button><button class="tab-btn" data-tab="notes">模板说明</button><button class="tab-btn" data-tab="json">原始数据</button></div><div class="panel view active" id="view-overview"><div class="meta-grid" id="metaGrid"></div></div><div class="panel view" id="view-notes"><div id="notesContent" class="empty">暂无模板说明。</div></div><div class="panel view" id="view-json"><pre id="jsonPreview">正在加载…</pre></div></section></div>
    <script>
      const state={activeTab:'overview',data:null};const statusBadge=document.getElementById('statusBadge');const pageTitle=document.getElementById('pageTitle');const pageDescription=document.getElementById('pageDescription');const stats=document.getElementById('stats');const metaGrid=document.getElementById('metaGrid');const notesContent=document.getElementById('notesContent');const jsonPreview=document.getElementById('jsonPreview');document.querySelectorAll('.tab-btn').forEach((button)=>{button.addEventListener('click',()=>{state.activeTab=button.dataset.tab;document.querySelectorAll('.tab-btn').forEach((item)=>item.classList.toggle('active',item===button));document.querySelectorAll('.view').forEach((view)=>view.classList.remove('active'));document.getElementById(`view-${state.activeTab}`).classList.add('active');});});async function init(){try{const response=await fetch('./graph.json');if(!response.ok) throw new Error('graph.json 加载失败');state.data=await response.json();render();}catch(error){pageDescription.textContent=`加载失败：${error.message}`;jsonPreview.textContent=String(error);}}function render(){const {metadata={},nodes=[],edges=[],development_tracks=[],practical_implications=[],template_notes=[]}=state.data;document.title=`${metadata.title || '知识图谱模板页'} · 模板页`;statusBadge.textContent=metadata.status==='template'?'模板数据':(metadata.status||'知识图谱');pageTitle.textContent=metadata.title||'知识图谱模板页';pageDescription.textContent=metadata.description||'这是一个可扩展的图谱模板页。';const statItems=[['节点数',String(nodes.length)],['关系数',String(edges.length)],['轨迹数',String(development_tracks.length)],['实践条目',String(practical_implications.length)]];stats.innerHTML=statItems.map(([label,value])=>`<div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${value}</div></div>`).join('');const metaItems=[['主题',metadata.topic||'未定义'],['状态',metadata.status||'未定义'],['语言',metadata.language||'未定义'],['创建日期',metadata.created_at||'未定义']];metaGrid.innerHTML=metaItems.map(([label,value])=>`<div class="meta-item"><strong>${label}</strong><div>${value}</div></div>`).join('');notesContent.className=template_notes.length?'':'empty';notesContent.innerHTML=template_notes.length?`<ul>${template_notes.map((item)=>`<li>${item}</li>`).join('')}</ul>`:'暂无模板说明。';jsonPreview.textContent=JSON.stringify(state.data,null,2);}init();
    </script>
  </body>
</html>
