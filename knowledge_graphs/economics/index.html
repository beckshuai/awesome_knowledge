<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>经济学知识图谱</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(15, 23, 42, 0.82);
      --panel-2: rgba(30, 41, 59, 0.78);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --line: rgba(148, 163, 184, 0.28);
      --accent: #38bdf8;
      --era: #f59e0b;
      --school: #a78bfa;
      --person: #34d399;
      --work: #fb7185;
      --concept: #60a5fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.24), transparent 34rem),
        radial-gradient(circle at 80% 18%, rgba(167, 139, 250, 0.22), transparent 30rem),
        linear-gradient(135deg, #020617 0%, #0f172a 46%, #111827 100%);
      min-height: 100vh;
    }
    header {
      padding: 28px clamp(18px, 4vw, 48px) 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(2, 6, 23, 0.48);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 48px); letter-spacing: -0.04em; }
    .subtitle { margin: 10px 0 0; color: var(--muted); max-width: 1000px; line-height: 1.75; }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) repeat(6, auto);
      gap: 10px;
      align-items: center;
      margin-top: 18px;
    }
    input, button {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.75);
      color: var(--text);
      padding: 10px 14px;
      outline: none;
    }
    input:focus, button:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56,189,248,.18); }
    button { cursor: pointer; transition: transform .15s ease, background .15s ease; }
    button:hover { transform: translateY(-1px); background: rgba(30, 41, 59, .95); }
    button.active { background: rgba(56, 189, 248, 0.2); border-color: var(--accent); }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(320px, 0.8fr);
      gap: 18px;
      padding: 18px clamp(18px, 4vw, 48px) 42px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.26);
      overflow: hidden;
    }
    .card h2 { margin: 0; padding: 18px 20px 0; font-size: 18px; }
    .graph-wrap { min-height: 660px; position: relative; }
    svg { display: block; width: 100%; height: 660px; }
    .link { stroke: rgba(148, 163, 184, 0.42); stroke-width: 1.3; }
    .link.active { stroke: #f8fafc; stroke-width: 2.4; }
    .node { cursor: pointer; filter: drop-shadow(0 6px 12px rgba(0,0,0,.35)); }
    .node.dim, .label.dim, .link.dim { opacity: .12; }
    .label { fill: #e5e7eb; font-size: 12px; pointer-events: none; text-shadow: 0 2px 8px #020617; }
    .legend {
      display: flex; flex-wrap: wrap; gap: 10px;
      padding: 0 20px 18px; color: var(--muted); font-size: 13px;
    }
    .dot { width: 10px; height: 10px; border-radius: 999px; display: inline-block; margin-right: 6px; }
    .side { display: flex; flex-direction: column; gap: 18px; }
    .detail { padding: 18px 20px 20px; }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 12px; }
    .detail h3 { margin: 12px 0 8px; font-size: 24px; }
    .detail p { color: #cbd5e1; line-height: 1.75; }
    .relations { display: grid; gap: 8px; margin-top: 14px; }
    .relation { padding: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel-2); color: #cbd5e1; font-size: 13px; }
    .timeline { padding: 8px 20px 20px; max-height: 470px; overflow: auto; }
    .event { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
    .event:hover .event-title { color: var(--accent); }
    .year { color: var(--accent); font-weight: 700; font-size: 13px; }
    .event-title { font-weight: 700; }
    .event-summary { color: var(--muted); margin-top: 5px; line-height: 1.55; font-size: 13px; }
    .matrix { padding: 12px 20px 20px; display: grid; gap: 10px; }
    .pill { padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel-2); color: #cbd5e1; line-height: 1.55; font-size: 13px; }
    .stats { position: absolute; right: 16px; top: 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .stat { background: rgba(2,6,23,.68); border: 1px solid var(--line); border-radius: 999px; padding: 7px 10px; color: var(--muted); font-size: 12px; }
    .hint { padding: 0 20px 18px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: 1fr 1fr 1fr; }
      .toolbar input { grid-column: 1 / -1; }
    }
    @media (max-width: 620px) {
      .toolbar { grid-template-columns: 1fr 1fr; }
      svg { height: 560px; }
      .graph-wrap { min-height: 560px; }
      .event { grid-template-columns: 78px 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>经济学知识图谱</h1>
    <p class="subtitle">覆盖经济学历史、主要人物、主要著作、主要观点与核心概念。可通过搜索、类型筛选、点击节点或时间线来查看知识图谱、发展轨迹与互相关联。</p>
    <div class="toolbar" id="toolbar">
      <input id="search" type="search" placeholder="搜索人物 / 著作 / 概念 / 学派，例如：凯恩斯、比较优势、信息不对称" />
      <button data-filter="all" class="active">全部</button>
      <button data-filter="era">历史</button>
      <button data-filter="school">学派</button>
      <button data-filter="person">人物</button>
      <button data-filter="work">著作</button>
      <button data-filter="concept">概念</button>
    </div>
  </header>

  <main>
    <section class="card graph-wrap">
      <h2>知识图谱</h2>
      <div class="stats" id="stats"></div>
      <svg id="graph" role="img" aria-label="经济学知识图谱"></svg>
      <div class="legend" id="legend"></div>
      <div class="hint">操作提示：拖动节点可调整布局；点击节点可高亮一阶关系；点击时间线可定位相应节点；搜索会同时匹配名称、时期与摘要。</div>
    </section>

    <aside class="side">
      <section class="card">
        <h2>节点详情与互相关联</h2>
        <div class="detail" id="detail"></div>
      </section>
      <section class="card">
        <h2>发展轨迹</h2>
        <div class="timeline" id="timeline"></div>
      </section>
      <section class="card">
        <h2>关键关联地图</h2>
        <div class="matrix" id="matrix"></div>
      </section>
    </aside>
  </main>

rnality','重释'], ['school_austrian','person_hayek','代表'], ['person_hayek','concept_invisible','自发秩序'], ['person_samuelson','school_keynesian','新古典综合'], ['person_samuelson','school_neoclassical','新古典综合'], ['person_schumpeter','concept_creative','阐释'], ['concept_creative','concept_growth','推动'], ['person_solow','concept_growth','模型化'], ['person_nash','concept_game','提出'], ['concept_game','school_information','方法基础'], ['school_information','person_stiglitz','代表'], ['person_stiglitz','concept_information','贡献'], ['concept_information','concept_externality','市场失灵'], ['school_development','person_sen','代表'], ['person_sen','work_poverty_famines','著有'], ['work_poverty_famines','concept_capability','相关'], ['person_ostrom','work_governing_commons','著有'], ['work_governing_commons','concept_commons','系统化'], ['school_behavioral','person_kahneman','代表'], ['person_kahneman','concept_prospect','提出'], ['school_behavioral','person_thaler','代表'], ['person_thaler','work_nudge','推动'], ['work_nudge','concept_nudge','普及'], ['school_development','person_duflo','代表'], ['person_duflo','work_poor_economics','合著'], ['work_poor_economics','concept_rct','应用'], ['person_acemoglu','work_why_nations','合著'], ['work_why_nations','concept_institutions','阐释'], ['person_krugman','concept_growth','贸易与地理'], ['school_physiocracy','person_qnay','代表'], ['person_qnay','concept_growth','循环思想'], ['school_institutional','person_veblen','代表']
      ].map(([source,target,relation]) => ({ source,target,relation })),
      timeline: [
        ['古代-15世纪','伦理、家政与公平价格','era_ancient','经济问题嵌入政治、伦理、宗教与国家治理。'], ['16-18世纪','重商主义与国家财富','era_mercantilism','贸易顺差、金银、关税和国家干预成为核心议题。'], ['1776','斯密《国富论》','work_wealth','现代经济学作为独立学科的重要起点。'], ['1817','李嘉图比较优势','work_ricardo','国际贸易理论的经典基础。'], ['1867','马克思《资本论》','work_capital','资本主义生产方式的系统批判。'], ['1870s','边际革命','era_marginal','主观价值与边际分析兴起。'], ['1890','马歇尔《经济学原理》','work_principles_marshall','供求、弹性、局部均衡成为微观核心工具。'], ['1936','凯恩斯革命','work_general','宏观经济学和总需求管理形成。'], ['1940s-1960s','新古典综合与计量化','person_samuelson','数学模型、统计估计和政策分析制度化。'], ['1960s-1970s','科斯、货币主义与公共选择','school_chicago','交易成本、产权、货币供给和政府失灵成为重要议题。'], ['1970s-1990s','信息、博弈与行为','era_modern','理性人模型被信息约束、策略互动和心理偏差扩展。'], ['2000s-至今','实验、制度、危机与不平等','concept_institutions','随机实验、长期制度、金融稳定、创新增长和分配问题成为焦点。']
      ].map(([year,title,node,summary]) => ({ year,title,node,summary }))
    };

    const colors = { era: '#f59e0b', school: '#a78bfa', person: '#34d399', work: '#fb7185', concept: '#60a5fa' };
    const sizes = { era: 15, school: 12, person: 10, work: 9, concept: 8 };
    const svg = document.getElementById('graph');
    const detail = document.getElementById('detail');
    const timelineEl = document.getElementById('timeline');
    const matrix = document.getElementById('matrix');
    const search = document.getElementById('search');
    let selected = data.nodes.find(n => n.id === 'work_wealth');
    let filter = 'all';
    let width = 900, height = 660, dragging = null;
    const nodeById = new Map(data.nodes.map(n => [n.id, n]));
    data.nodes.forEach((n, i) => {
      const band = ['era','school','person','work','concept'].indexOf(n.type);
      n.x = 110 + (band + 0.5) * 145 + Math.random() * 34;
      n.y = 72 + (i % 18) * 31 + Math.random() * 24;
      n.vx = 0; n.vy = 0;
    });
    data.links.forEach(l => { l.s = nodeById.get(l.source); l.t = nodeById.get(l.target); });

    function resize() { width = svg.clientWidth || 900; height = svg.clientHeight || 660; svg.setAttribute('viewBox', `0 0 ${width} ${height}`); }
    window.addEventListener('resize', resize); resize();

    function matches(n) {
      const q = search.value.trim().toLowerCase();
      const text = `${n.name} ${n.period || ''} ${n.summary}`.toLowerCase();
      return (filter === 'all' || n.type === filter) && (!q || text.includes(q));
    }
    function neighborIds(id) {
      const ids = new Set([id]);
      data.links.forEach(l => { if (l.source === id) ids.add(l.target); if (l.target === id) ids.add(l.source); });
      return ids;
    }
    function relationList(id) {
      return data.links.filter(l => l.source === id || l.target === id).map(l => {
        const other = nodeById.get(l.source === id ? l.target : l.source);
        return { relation: l.relation, other };
      });
    }
    function renderStatic() {
      document.getElementById('legend').innerHTML = Object.entries(data.categories).map(([k,v]) => `<span><i class="dot" style="background:${colors[k]}"></i>${v}</span>`).join('');
      const counts = Object.keys(data.categories).map(k => `${data.categories[k]} ${data.nodes.filter(n => n.type === k).length}`);
      document.getElementById('stats').innerHTML = [`节点 ${data.nodes.length}`, `关系 ${data.links.length}`, ...counts].map(x => `<span class="stat">${x}</span>`).join('');
      timelineEl.innerHTML = data.timeline.map(e => `<div class="event" data-node="${e.node}"><div class="year">${e.year}</div><div><div class="event-title">${e.title}</div><div class="event-summary">${e.summary}</div></div></div>`).join('');
      timelineEl.querySelectorAll('.event').forEach(el => el.addEventListener('click', () => select(nodeById.get(el.dataset.node))));
      matrix.innerHTML = [
        ['古典 → 新古典','从劳动价值、分配与增长问题，转向边际效用、供求均衡和效率分析。'],
        ['凯恩斯 → 现代宏观','从有效需求和失业出发，发展财政政策、货币政策、预期与价格黏性研究。'],
        ['制度 → 发展','产权、法治、国家能力和包容性制度被用于解释长期繁荣差异。'],
        ['信息 → 行为','信息不对称和有限理性共同扩展了完全理性与完全信息假设。'],
        ['博弈 → 机制设计','策略互动、激励相容和制度设计连接市场、组织与公共政策。']
      ].map(([a,b]) => `<div class="pill"><strong>${a}</strong><br>${b}</div>`).join('');
    }
    function renderDetail() {
      const rel = relationList(selected.id);
      detail.innerHTML = `<span class="badge"><i class="dot" style="background:${colors[selected.type]}"></i>${data.categories[selected.type]}${selected.period ? ' · ' + selected.period : ''}</span><h3>${selected.name}</h3><p>${selected.summary}</p><div class="relations">${rel.length ? rel.map(r => `<div class="relation"><strong>${r.relation}</strong> → ${r.other.name} <span style="color:#94a3b8">(${data.categories[r.other.type]})</span></div>`).join('') : '<div class="relation">暂无关联</div>'}</div>`;
    }
    function renderGraph() {
      const visible = new Set(data.nodes.filter(matches).map(n => n.id));
      const nbs = neighborIds(selected.id);
      svg.innerHTML = '';
      const gLinks = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      const gNodes = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      svg.append(gLinks, gNodes);
      data.links.forEach(l => {
        if (!visible.has(l.source) || !visible.has(l.target)) return;
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', l.s.x); line.setAttribute('y1', l.s.y); line.setAttribute('x2', l.t.x); line.setAttribute('y2', l.t.y);
        line.setAttribute('class', `link ${nbs.has(l.source) && nbs.has(l.target) ? 'active' : selected ? 'dim' : ''}`);
        gLinks.appendChild(line);
      });
      data.nodes.forEach(n => {
        if (!visible.has(n.id)) return;
        const active = nbs.has(n.id);
        const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        group.setAttribute('transform', `translate(${n.x},${n.y})`);
        group.setAttribute('class', `node ${active ? '' : 'dim'}`);
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('r', sizes[n.type] + (n.id === selected.id ? 5 : 0));
        circle.setAttribute('fill', colors[n.type]);
        circle.setAttribute('stroke', n.id === selected.id ? '#fff' : 'rgba(255,255,255,.55)');
        circle.setAttribute('stroke-width', n.id === selected.id ? '3' : '1.2');
        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('x', sizes[n.type] + 7); label.setAttribute('y', 4); label.setAttribute('class', `label ${active ? '' : 'dim'}`); label.textContent = n.name;
        group.append(circle, label);
        group.addEventListener('click', () => select(n));
        group.addEventListener('pointerdown', e => { dragging = n; svg.setPointerCapture(e.pointerId); });
        gNodes.appendChild(group);
      });
    }
    function tick() {
      const visibleNodes = data.nodes.filter(matches);
      for (let i = 0; i < visibleNodes.length; i++) for (let j = i + 1; j < visibleNodes.length; j++) {
        const a = visibleNodes[i], b = visibleNodes[j];
        let dx = a.x - b.x, dy = a.y - b.y, d2 = dx*dx + dy*dy + 0.01;
        const f = Math.min(2200 / d2, 1.6); a.vx += dx * f * .01; a.vy += dy * f * .01; b.vx -= dx * f * .01; b.vy -= dy * f * .01;
      }
      data.links.forEach(l => {
        if (!matches(l.s) || !matches(l.t)) return;
        const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y, dist = Math.hypot(dx, dy) || 1, desired = 92;
        const f = (dist - desired) * .006; l.s.vx += dx / dist * f; l.s.vy += dy / dist * f; l.t.vx -= dx / dist * f; l.t.vy -= dy / dist * f;
      });
      data.nodes.forEach(n => {
        const targetX = ({era:.12, school:.28, person:.46, work:.64, concept:.82}[n.type]) * width;
        n.vx += (targetX - n.x) * .003; n.vy += (height/2 - n.y) * .001;
        if (n !== dragging) { n.x += n.vx; n.y += n.vy; }
        n.vx *= .82; n.vy *= .82; n.x = Math.max(24, Math.min(width-150, n.x)); n.y = Math.max(34, Math.min(height-28, n.y));
      });
      renderGraph(); requestAnimationFrame(tick);
    }
    function select(n) { if (!n) return; selected = n; renderDetail(); renderGraph(); }
    svg.addEventListener('pointermove', e => { if (!dragging) return; const r = svg.getBoundingClientRect(); dragging.x = (e.clientX - r.left) * width / r.width; dragging.y = (e.clientY - r.top) * height / r.height; dragging.vx = dragging.vy = 0; });
    svg.addEventListener('pointerup', () => dragging = null);
    search.addEventListener('input', renderGraph);
    document.getElementById('toolbar').addEventListener('click', e => {
      if (e.target.tagName !== 'BUTTON') return;
      filter = e.target.dataset.filter;
      document.querySelectorAll('#toolbar button').forEach(b => b.classList.toggle('active', b === e.target));
      renderGraph();
    });
    renderStatic(); renderDetail(); tick();
  </script>
